<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Tiro ao Alvo</title>
    <!-- Importando A-Frame e AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      /* Tela de Menu Inicial */
      #start-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999999;
        color: white;
        text-align: center;
      }

      #start-screen h1 {
        font-size: 32px;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      #start-screen p {
        font-size: 16px;
        margin-bottom: 30px;
        color: #ccc;
        max-width: 80%;
      }

      #start-btn {
        padding: 15px 40px;
        font-size: 20px;
        font-weight: bold;
        color: white;
        background-color: #E50914;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        transition: transform 0.2s, background-color 0.2s;
      }

      #start-btn:active {
        transform: scale(0.95);
        background-color: #b80710;
      }

      /* Interface do placar (HUD) */
      #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        z-index: 99999;
        pointer-events: none;
        user-select: none;
        display: none; /* Escondido até iniciar */
      }
    </style>
    <script>
      let score = 0;
      let gameStarted = false;

      // Gera a textura do alvo clássico concêntrico
      function createTargetTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, 512, 512);

        const rings = [
          { r: 250, color: '#E50914' },
          { r: 200, color: '#FFFFFF' },
          { r: 150, color: '#E50914' },
          { r: 100, color: '#FFFFFF' },
          { r: 50,  color: '#E50914' }
        ];

        rings.forEach(ring => {
          ctx.beginPath();
          ctx.arc(256, 256, ring.r, 0, 2 * Math.PI, false);
          ctx.fillStyle = ring.color;
          ctx.fill();
        });

        return canvas.toDataURL();
      }

      // Função global para destruir o alvo ao ser atingido
      function hitTarget(el) {
        if (!gameStarted || el.dataset.hit) return;
        el.dataset.hit = "true";

        score += 10;
        const hud = document.getElementById('score-val');
        if (hud) hud.innerText = score;
        
        // Animação de acerto
        el.setAttribute('animation__hit', 'property: scale; to: 0 0 0; dur: 150');
        setTimeout(() => {
          if (el.parentNode) {
            el.parentNode.removeChild(el);
          }
        }, 150);
      }

      // Componente do alvo
      AFRAME.registerComponent('shootable', {
        init: function () {
          const el = this.el;
          el.addEventListener('click', () => hitTarget(el));
          el.addEventListener('touchstart', (e) => {
            e.preventDefault();
            hitTarget(el);
          });
        }
      });

      // Gerenciador de toques/cliques na tela
      AFRAME.registerComponent('screen-tap-handler', {
        init: function () {
          const sceneEl = this.el;
          
          const handleTap = (clientX, clientY) => {
            if (!gameStarted) return;

            const cameraEl = sceneEl.camera;
            if (!cameraEl) return;

            const mouse = new THREE.Vector2();
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, cameraEl);

            const targetEls = document.querySelectorAll('.target');
            const targetObjects = Array.from(targetEls).map(el => el.object3D);

            const intersects = raycaster.intersectObjects(targetObjects, true);

            if (intersects.length > 0) {
              let obj = intersects[0].object;
              while (obj && !obj.el && obj.parent) {
                obj = obj.parent;
              }
              if (obj && obj.el) {
                hitTarget(obj.el);
              }
            }
          };

          window.addEventListener('click', (evt) => {
            handleTap(evt.clientX, evt.clientY);
          });

          window.addEventListener('touchend', (evt) => {
            if (evt.changedTouches.length > 0) {
              const touch = evt.changedTouches[0];
              handleTap(touch.clientX, touch.clientY);
            }
          });
        }
      });

      // Gerenciador de alvos (Só roda após clicar em Iniciar)
      AFRAME.registerComponent('target-spawner', {
        init: function () {
          this.sceneEl = this.el;
          this.targetTextureUrl = createTargetTexture();
        },

        startSpawning: function () {
          // Cria o primeiro alvo
          this.spawnTarget();

          // Cria novos alvos a cada 2.5s
          this.timer = setInterval(() => {
            if (!gameStarted) return;
            const currentTargets = document.querySelectorAll('.target');
            if (currentTargets.length < 4) {
              this.spawnTarget();
            }
          }, 2500);
        },

        spawnTarget: function () {
          const cameraEl = document.querySelector('#main-camera');
          
          let cameraPos = { x: 0, y: 1.6, z: 0 };
          if (cameraEl && cameraEl.object3D) {
            const worldPos = new THREE.Vector3();
            cameraEl.object3D.getWorldPosition(worldPos);
            cameraPos = { x: worldPos.x, y: worldPos.y, z: worldPos.z };
          }

          const targetDisc = document.createElement('a-plane');
          targetDisc.setAttribute('class', 'target');
          targetDisc.setAttribute('shootable', '');
          targetDisc.setAttribute('width', '1.2');
          targetDisc.setAttribute('height', '1.2');
          targetDisc.setAttribute('material', `src: url(${this.targetTextureUrl}); transparent: true; side: double; shader: flat`);

          // Posições 360° em volta da câmera
          const angle = Math.random() * Math.PI * 2;
          const distance = 2.0 + Math.random() * 2.0;
          
          const x = cameraPos.x + Math.cos(angle) * distance;
          const y = cameraPos.y + (Math.random() - 0.5) * 1.5;
          const z = cameraPos.z + Math.sin(angle) * distance;

          targetDisc.setAttribute('position', `${x} ${y} ${z}`);
          targetDisc.setAttribute('animation', 'property: scale; from: 0 0 0; to: 1 1 1; dur: 300');

          this.sceneEl.appendChild(targetDisc);

          setTimeout(() => {
            if (targetDisc.object3D && cameraEl && cameraEl.object3D) {
              const camPos = new THREE.Vector3();
              cameraEl.object3D.getWorldPosition(camPos);
              targetDisc.object3D.lookAt(camPos);
            }
          }, 50);

          setTimeout(() => {
            if (targetDisc.parentNode) {
              targetDisc.parentNode.removeChild(targetDisc);
            }
          }, 6000);
        }
      });

      // Função chamada ao clicar no botão "Iniciar"
      function startGame() {
        gameStarted = true;
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'block';

        // Inicia a criação dos alvos
        const scene = document.querySelector('a-scene');
        if (scene && scene.components['target-spawner']) {
          scene.components['target-spawner'].startSpawning();
        }
      }
    </script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <!-- Menu Inicial -->
    <div id="start-screen">
      <h1>Jogo de Tiro AR</h1>
      <p>Gire o celular em 360° para encontrar os alvos e toque neles para pontuar!</p>
      <button id="start-btn" onclick="startGame()">INICIAR JOGO</button>
    </div>

    <!-- Placar (HUD) -->
    <div id="hud">Pontos: <span id="score-val">0</span></div>

    <!-- Cena A-Frame com AR.js -->
    <a-scene target-spawner screen-tap-handler embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
      
      <a-entity camera look-controls id="main-camera">
        <a-entity position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                  material="color: white; shader: flat">
        </a-entity>
      </a-entity>

      <a-light type="ambient" color="#FFF"></a-light>
    </a-scene>

  </body>
</html>
