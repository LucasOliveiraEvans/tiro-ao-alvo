<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Tiro ao Alvo - Modos de Jogo</title>
    <!-- Importando A-Frame e AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      /* Interface das Telas por cima do AR */
      .ui-layer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 999999;
        pointer-events: auto;
      }

      .screen {
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .screen h1 {
        font-size: 32px;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #FFFFFF;
      }

      .screen p {
        font-size: 15px;
        margin-bottom: 25px;
        color: #DDD;
        max-width: 90%;
        line-height: 1.4;
      }

      .btn {
        width: 100%;
        max-width: 280px;
        padding: 15px 20px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background-color: #E50914;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(229, 9, 20, 0.5);
        margin-bottom: 15px;
        pointer-events: auto;
        touch-action: manipulation;
      }

      .btn-secondary {
        background-color: #0055FF;
        box-shadow: 0 4px 15px rgba(0, 85, 255, 0.5);
      }

      .btn-quit {
        background-color: #444;
        font-size: 14px;
        padding: 8px 16px;
        border-radius: 20px;
        margin: 0;
        width: auto;
        box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      }

      .btn:active {
        transform: scale(0.95);
      }

      /* Placar, Cronômetro e Botão de Sair (HUD) */
      #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
        font-size: 20px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        z-index: 99999;
        pointer-events: auto;
        user-select: none;
        display: none;
      }
    </style>
    <script>
      let score = 0;
      let timeLeft = 30;
      let gameMode = 'arcade';
      let gameStarted = false;
      let timerInterval = null;
      let normalTextureUrl = "";
      let specialTextureUrl = "";

      // Textura Vermelha e Branca (Alvo Normal - 10 pts)
      function createNormalTargetTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 512, 512);

        const rings = [
          { r: 250, color: '#E50914' },
          { r: 200, color: '#FFFFFF' },
          { r: 150, color: '#E50914' },
          { r: 100, color: '#FFFFFF' },
          { r: 50,  color: '#E50914' }
        ];

        rings.forEach(ring => {
          ctx.beginPath();
          ctx.arc(256, 256, ring.r, 0, 2 * Math.PI, false);
          ctx.fillStyle = ring.color;
          ctx.fill();
        });

        return canvas.toDataURL();
      }

      // Textura Listrada de Preto e Azul (Alvo Especial - 20 pts)
      function createSpecialTargetTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 512, 512);

        const rings = [
          { r: 250, color: '#0055FF' }, // Azul
          { r: 200, color: '#000000' }, // Preto
          { r: 150, color: '#0055FF' }, // Azul
          { r: 100, color: '#000000' }, // Preto
          { r: 50,  color: '#00E5FF' }  // Centro Azul Claro
        ];

        rings.forEach(ring => {
          ctx.beginPath();
          ctx.arc(256, 256, ring.r, 0, 2 * Math.PI, false);
          ctx.fillStyle = ring.color;
          ctx.fill();
        });

        return canvas.toDataURL();
      }

      // Destruição do Alvo e Pontuação
      function hitTarget(el) {
        if (!gameStarted || el.dataset.hit === "true") return;
        el.dataset.hit = "true";

        const isSpecial = el.dataset.special === "true";
        const points = isSpecial ? 20 : 10;

        score += points;
        const hudScore = document.getElementById('score-val');
        if (hudScore) hudScore.innerText = score;
        
        el.setAttribute('animation__hit', 'property: scale; to: 0 0 0; dur: 150');
        setTimeout(() => {
          if (el.parentNode) {
            el.parentNode.removeChild(el);
          }
        }, 150);
      }

      // Componente do Alvo
      AFRAME.registerComponent('shootable', {
        init: function () {
          const el = this.el;
          el.addEventListener('click', () => hitTarget(el));
          el.addEventListener('touchstart', (e) => {
            e.preventDefault();
            hitTarget(el);
          });
        }
      });

      // Manipulador Global de Toque na Tela
      AFRAME.registerComponent('screen-tap-handler', {
        init: function () {
          const sceneEl = this.el;
          
          const handleTap = (clientX, clientY) => {
            if (!gameStarted) return;

            const cameraEl = sceneEl.camera;
            if (!cameraEl) return;

            const mouse = new THREE.Vector2();
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, cameraEl);

            const targetEls = document.querySelectorAll('.target');
            const targetObjects = Array.from(targetEls).map(el => el.object3D);

            const intersects = raycaster.intersectObjects(targetObjects, true);

            if (intersects.length > 0) {
              let obj = intersects[0].object;
              while (obj && !obj.el && obj.parent) {
                obj = obj.parent;
              }
              if (obj && obj.el) {
                hitTarget(obj.el);
              }
            }
          };

          window.addEventListener('click', (evt) => {
            if (evt.target.tagName === 'BUTTON') return;
            handleTap(evt.clientX, evt.clientY);
          });

          window.addEventListener('touchend', (evt) => {
            if (evt.target.tagName === 'BUTTON') return;
            if (evt.changedTouches.length > 0) {
              const touch = evt.changedTouches[0];
              handleTap(touch.clientX, touch.clientY);
            }
          });
        }
      });

      // Gerenciador de Alvos (Spawn em 360°, Distância Aumentada)
      AFRAME.registerComponent('target-spawner', {
        init: function () {
          this.sceneEl = this.el;
          normalTextureUrl = createNormalTargetTexture();
          specialTextureUrl = createSpecialTargetTexture();
        },

        startSpawning: function () {
          this.spawnTarget();

          this.spawnerInterval = setInterval(() => {
            if (!gameStarted) return;
            const currentTargets = document.querySelectorAll('.target');
            if (currentTargets.length < 4) {
              this.spawnTarget();
            }
          }, 2200);
        },

        spawnTarget: function () {
          if (!gameStarted) return;

          const cameraEl = document.querySelector('#main-camera');
          let cameraPos = { x: 0, y: 1.6, z: 0 };
          if (cameraEl && cameraEl.object3D) {
            const worldPos = new THREE.Vector3();
            cameraEl.object3D.getWorldPosition(worldPos);
            cameraPos = { x: worldPos.x, y: worldPos.y, z: worldPos.z };
          }

          const targetDisc = document.createElement('a-plane');
          targetDisc.setAttribute('class', 'target');
          targetDisc.setAttribute('shootable', '');

          // Variar Tamanho do Alvo (entre 0.8m e 1.6m)
          const randomSize = (Math.random() * 0.8 + 0.8).toFixed(2);
          targetDisc.setAttribute('width', randomSize);
          targetDisc.setAttribute('height', randomSize);

          // 35% de chance de nascer Alvo Especial (Preto e Azul)
          const isSpecial = Math.random() < 0.35;
          targetDisc.dataset.special = isSpecial ? "true" : "false";
          const textureUrl = isSpecial ? specialTextureUrl : normalTextureUrl;

          targetDisc.setAttribute('material', `src: url(${textureUrl}); transparent: true; side: double; shader: flat`);

          // DISTÂNCIA AUMENTADA: Entre 6.0m e 10.0m do jogador (afastado da câmera)
          const angle = Math.random() * Math.PI * 2;
          const distance = 6.0 + Math.random() * 4.0;
          
          const x = cameraPos.x + Math.cos(angle) * distance;
          const y = cameraPos.y + (Math.random() - 0.5) * 3.0; // Variação de altura
          const z = cameraPos.z + Math.sin(angle) * distance;

          targetDisc.setAttribute('position', `${x} ${y} ${z}`);
          targetDisc.setAttribute('animation', 'property: scale; from: 0 0 0; to: 1 1 1; dur: 300');

          this.sceneEl.appendChild(targetDisc);

          setTimeout(() => {
            if (targetDisc.object3D && cameraEl && cameraEl.object3D) {
              const camPos = new THREE.Vector3();
              cameraEl.object3D.getWorldPosition(camPos);
              targetDisc.object3D.lookAt(camPos);
            }
          }, 50);

          // Alvo expira após 6 segundos
          setTimeout(() => {
            if (targetDisc.parentNode) {
              targetDisc.parentNode.removeChild(targetDisc);
            }
          }, 6000);
        },

        stop: function () {
          clearInterval(this.spawnerInterval);
          document.querySelectorAll('.target').forEach(el => {
            if (el.parentNode) el.parentNode.removeChild(el);
          });
        }
      });

      // Inicialização do Modo Selecionado
      function selectMode(mode) {
        gameMode = mode;
        score = 0;
        timeLeft = 30;
        gameStarted = true;

        document.getElementById('start-layer').style.display = 'none';
        document.getElementById('game-over-layer').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('score-val').innerText = score;

        if (gameMode === 'arcade') {
          document.getElementById('timer-container').style.display = 'block';
          document.getElementById('timer-val').innerText = timeLeft;

          if (timerInterval) clearInterval(timerInterval);
          timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-val').innerText = timeLeft;

            if (timeLeft <= 0) {
              endGame();
            }
          }, 1000);
        } else {
          document.getElementById('timer-container').style.display = 'none';
        }

        const scene = document.querySelector('a-scene');
        if (scene && scene.components['target-spawner']) {
          scene.components['target-spawner'].startSpawning();
        }
      }

      function endGame() {
        gameStarted = false;
        if (timerInterval) clearInterval(timerInterval);

        const scene = document.querySelector('a-scene');
        if (scene && scene.components['target-spawner']) {
          scene.components['target-spawner'].stop();
        }

        document.getElementById('hud').style.display = 'none';
        document.getElementById('final-score').innerText = score;
        document.getElementById('game-over-layer').style.display = 'block';
      }

      function returnToMenu() {
        gameStarted = false;
        if (timerInterval) clearInterval(timerInterval);

        const scene = document.querySelector('a-scene');
        if (scene && scene.components['target-spawner']) {
          scene.components['target-spawner'].stop();
        }

        document.getElementById('hud').style.display = 'none';
        document.getElementById('game-over-layer').style.display = 'none';
        document.getElementById('start-layer').style.display = 'block';
      }
    </script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <!-- Tela de Menu Inicial -->
    <div id="start-layer" class="ui-layer">
      <div class="screen">
        <h1>Tiro ao Alvo AR</h1>
        <p>
          Alvos Vermelhos = 10 pts<br>
          <b>Alvos Pretos & Azuis = 20 pts (Especial)</b><br><br>
          Gire 360° para encontrar alvos no ambiente!
        </p>
        <button class="btn" onclick="selectMode('arcade')">MODO ARCADE (30s)</button>
        <button class="btn btn-secondary" onclick="selectMode('livre')">MODO LIVRE (Treino)</button>
      </div>
    </div>

    <!-- Tela de Game Over -->
    <div id="game-over-layer" class="ui-layer" style="display: none;">
      <div class="screen">
        <h1>Fim de Jogo!</h1>
        <p>Pontuação Final: <br><span id="final-score" style="font-size: 36px; color: #E50914; font-weight: bold;">0</span> PONTOS</p>
        <button class="btn" onclick="selectMode(gameMode)">JOGAR NOVAMENTE</button>
        <button class="btn btn-secondary" onclick="returnToMenu()">MENU PRINCIPAL</button>
      </div>
    </div>

    <!-- Interface HUD (Pontos, Tempo e Botão de Sair) -->
    <div id="hud">
      <div>Pontos: <span id="score-val">0</span></div>
      <div id="timer-container">Tempo: <span id="timer-val">30</span>s</div>
      <button class="btn btn-quit" onclick="returnToMenu()">Sair / Menu</button>
    </div>

    <!-- Cena A-Frame + AR.js -->
    <a-scene target-spawner screen-tap-handler embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
      
      <a-entity camera look-controls id="main-camera">
        <!-- Retículo / Mira Central -->
        <a-entity position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                  material="color: white; shader: flat">
        </a-entity>
      </a-entity>

      <a-light type="ambient" color="#FFF"></a-light>
    </a-scene>

  </body>
</html>
