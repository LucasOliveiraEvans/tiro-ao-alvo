<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Tiro ao Alvo</title>
    <!-- Importando A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      /* Estilo para o placar e interface (HUD) */
      #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        z-index: 9999;
        pointer-events: none;
        user-select: none;
      }
    </style>
    <script>
      let score = 0;

      // Cria a textura procedural do alvo clássico (círculos concêntricos)
      function createTargetTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const centerX = 256;
        const centerY = 256;

        ctx.clearRect(0, 0, 512, 512);

        const rings = [
          { r: 250, color: '#E50914' }, // Borda externa vermelha
          { r: 200, color: '#FFFFFF' }, // Anel branco
          { r: 150, color: '#E50914' }, // Anel vermelho
          { r: 100, color: '#FFFFFF' }, // Anel branco
          { r: 50,  color: '#E50914' }  // Centro vermelho
        ];

        rings.forEach(ring => {
          ctx.beginPath();
          ctx.arc(centerX, centerY, ring.r, 0, 2 * Math.PI, false);
          ctx.fillStyle = ring.color;
          ctx.fill();
        });

        return canvas.toDataURL();
      }

      // Componente para registrar o tiro / clique e toque em modo AR e 3D
      AFRAME.registerComponent('shootable', {
        init: function () {
          const el = this.el;
          
          const hitHandler = (evt) => {
            if (evt) evt.stopPropagation();
            
            if (el.dataset.hit) return;
            el.dataset.hit = "true";

            score += 10;
            const hudScore = document.getElementById('score-val');
            if (hudScore) hudScore.innerText = score;
            
            // Animação de acerto (encolher rapidamente)
            el.setAttribute('animation__hit', 'property: scale; to: 0 0 0; dur: 150');
            setTimeout(() => {
              if (el.parentNode) {
                el.parentNode.removeChild(el);
              }
            }, 150);
          };

          // Eventos para clique padrão de PC, toque comum e toque nativo do WebXR AR
          el.addEventListener('click', hitHandler);
          el.addEventListener('mousedown', hitHandler);
          el.addEventListener('touchstart', hitHandler);
          el.addEventListener('select', hitHandler); // Essencial para o botão de AR no celular
        }
      });

      // Componente para gerenciar a criação de alvos em 360 graus em volta da câmera
      AFRAME.registerComponent('target-spawner', {
        init: function () {
          const sceneEl = this.el;
          this.targetTextureUrl = createTargetTexture();

          // Intervalo de 2.5 segundos
          this.timer = setInterval(() => {
            const currentTargets = document.querySelectorAll('.target');
            if (currentTargets.length < 4) {
              this.spawnTarget(sceneEl);
            }
          }, 2500);
          
          // Cria o primeiro alvo imediatamente
          this.spawnTarget(sceneEl);
        },

        spawnTarget: function (sceneEl) {
          const cameraEl = document.querySelector('#main-camera');
          
          // Pega a posição global real do jogador em 3D ou AR
          let cameraPos = { x: 0, y: 1.6, z: 0 };
          if (cameraEl) {
            const worldPos = new THREE.Vector3();
            cameraEl.object3D.getWorldPosition(worldPos);
            cameraPos = { x: worldPos.x, y: worldPos.y, z: worldPos.z };
          }

          const targetDisc = document.createElement('a-plane');
          targetDisc.setAttribute('class', 'target');
          targetDisc.setAttribute('shootable', '');
          targetDisc.setAttribute('width', '1.2');
          targetDisc.setAttribute('height', '1.2');
          targetDisc.setAttribute('material', `src: url(${this.targetTextureUrl}); transparent: true; side: double; shader: flat`);

          // Coordenadas polares em 360 graus em relação à posição da câmera
          const angle = Math.random() * Math.PI * 2;
          const distance = 2.0 + Math.random() * 2.0;
          
          const x = cameraPos.x + Math.cos(angle) * distance;
          const y = cameraPos.y + (Math.random() - 0.5) * 1.0;
          const z = cameraPos.z + Math.sin(angle) * distance;

          targetDisc.setAttribute('position', `${x} ${y} ${z}`);
          
          // Animação de entrada
          targetDisc.setAttribute('animation', 'property: scale; from: 0 0 0; to: 1 1 1; dur: 300');

          sceneEl.appendChild(targetDisc);

          // Garante que o alvo fique virado para a câmera após entrar na cena
          setTimeout(() => {
            if (targetDisc.object3D && cameraEl) {
              const camWorldPos = new THREE.Vector3();
              cameraEl.object3D.getWorldPosition(camWorldPos);
              targetDisc.object3D.lookAt(camWorldPos);
            }
          }, 50);

          // Remove automaticamente após 6 segundos se não for atingido
          setTimeout(() => {
            if (targetDisc.parentNode) {
              targetDisc.parentNode.removeChild(targetDisc);
            }
          }, 6000);
        },

        remove: function () {
          clearInterval(this.timer);
        }
      });
    </script>
  </head>
  <body>
    <!-- Placar na tela (HUD) -->
    <div id="hud">Pontos: <span id="score-val">0</span></div>

    <!-- Cena com suporte nativo a WebXR AR (Câmera do Celular + Toque) -->
    <a-scene target-spawner webxr="optionalFeatures: hit-test, local-floor;" ar-mode-ui="enabled: true">
      
      <!-- Rig da Câmera -->
      <a-entity id="camera-rig" position="0 0 0">
        <a-entity camera look-controls position="0 1.6 0" id="main-camera">
          <!-- Cursor otimizado tanto para mouse quanto para toque em tela cheia e AR -->
          <a-entity cursor="rayOrigin: mouse; fuse: false"
                    raycaster="objects: .target; interval: 50"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                    material="color: white; shader: flat">
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Luz ambiente -->
      <a-light type="ambient" color="#FFF"></a-light>
    </a-scene>
  </body>
</html>
