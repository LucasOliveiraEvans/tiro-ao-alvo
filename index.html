<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Tiro ao Alvo - Modos de Jogo</title>
    <!-- Importando A-Frame e AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      /* Telas de Menu e Fim de Jogo */
      .screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999999;
        color: white;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .screen h1 {
        font-size: 30px;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .screen p {
        font-size: 15px;
        margin-bottom: 25px;
        color: #ccc;
        max-width: 90%;
      }

      .btn {
        width: 100%;
        max-width: 280px;
        padding: 14px 20px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background-color: #E50914;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        margin-bottom: 15px;
        transition: transform 0.2s, background-color 0.2s;
      }

      .btn-secondary {
        background-color: #333;
        border: 2px solid #555;
      }

      .btn:active {
        transform: scale(0.95);
      }

      /* Placar e Cronômetro (HUD) */
      #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        color: white;
        font-size: 22px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        z-index: 99999;
        pointer-events: none;
        user-select: none;
        display: none;
      }

      #game-over-screen {
        display: none;
      }
    </style>
    <script>
      let score = 0;
      let timeLeft = 30;
      let gameMode = 'arcade'; // 'arcade' ou 'livre'
      let gameStarted = false;
      let timerInterval = null;

      // Cria a textura do alvo normal (Vermelho e Branco)
      function createNormalTargetTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, 512, 512);

        const rings = [
          { r: 250, color: '#E50914' },
          { r: 200, color: '#FFFFFF' },
          { r: 150, color: '#E50914' },
          { r: 100, color: '#FFFFFF' },
          { r: 50,  color: '#E50914' }
        ];

        rings.forEach(ring => {
          ctx.beginPath();
          ctx.arc(256, 256, ring.r, 0, 2 * Math.PI, false);
          ctx.fillStyle = ring.color;
          ctx.fill();
        });

        return canvas.toDataURL();
      }

      // Cria a textura do alvo especial (Listras Pretas e Azuis)
      function createSpecialTargetTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, 512, 512);

        const rings = [
          { r: 250, color: '#0055FF' },
          { r: 200, color: '#000000' },
          { r: 150, color: '#0055FF' },
          { r: 100, color: '#000000' },
          { r: 50,  color: '#00FFCC' }
        ];

        rings.forEach(ring => {
          ctx.beginPath();
          ctx.arc(256, 256, ring.r, 0, 2 * Math.PI, false);
          ctx.fillStyle = ring.color;
          ctx.fill();
        });

        return canvas.toDataURL();
      }

      // Função para destruir o alvo e somar pontos
      function hitTarget(el) {
        if (!gameStarted || el.dataset.hit) return;
        el.dataset.hit = "true";

        const isSpecial = el.dataset.special === "true";
        const points = isSpecial ? 20 : 10;

        score += points;
        const hudScore = document.getElementById('score-val');
        if (hudScore) hudScore.innerText = score;
        
        el.setAttribute('animation__hit', 'property: scale; to: 0 0 0; dur: 150');
        setTimeout(() => {
          if (el.parentNode) {
            el.parentNode.removeChild(el);
          }
        }, 150);
      }

      // Componente do alvo
      AFRAME.registerComponent('shootable', {
        init: function () {
          const el = this.el;
          el.addEventListener('click', () => hitTarget(el));
          el.addEventListener('touchstart', (e) => {
            e.preventDefault();
            hitTarget(el);
          });
        }
      });

      // Manipulador global de toque na tela
      AFRAME.registerComponent('screen-tap-handler', {
        init: function () {
          const sceneEl = this.el;
          
          const handleTap = (clientX, clientY) => {
            if (!gameStarted) return;

            const cameraEl = sceneEl.camera;
            if (!cameraEl) return;

            const mouse = new THREE.Vector2();
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, cameraEl);

            const targetEls = document.querySelectorAll('.target');
            const targetObjects = Array.from(targetEls).map(el => el.object3D);

            const intersects = raycaster.intersectObjects(targetObjects, true);

            if (intersects.length > 0) {
              let obj = intersects[0].object;
              while (obj && !obj.el && obj.parent) {
                obj = obj.parent;
              }
              if (obj && obj.el) {
                hitTarget(obj.el);
              }
            }
          };

          window.addEventListener('click', (evt) => {
            handleTap(evt.clientX, evt.clientY);
          });

          window.addEventListener('touchend', (evt) => {
            if (evt.changedTouches.length > 0) {
              const touch = evt.changedTouches[0];
              handleTap(touch.clientX, touch.clientY);
            }
          });
        }
      });

      // Gerenciador de alvos
      AFRAME.registerComponent('target-spawner', {
        init: function () {
          this.sceneEl = this.el;
          this.normalTexture = createNormalTargetTexture();
          this.specialTexture = createSpecialTargetTexture();
        },

        startSpawning: function () {
          this.spawnTarget();

          this.spawnerInterval = setInterval(() => {
            if (!gameStarted) return;
            const currentTargets = document.querySelectorAll('.target');
            if (currentTargets.length < 4) {
              this.spawnTarget();
            }
          }, 2500);
        },

        spawnTarget: function () {
          if (!gameStarted) return;

          const cameraEl = document.querySelector('#main-camera');
          let cameraPos = { x: 0, y: 1.6, z: 0 };
          if (cameraEl && cameraEl.object3D) {
            const worldPos = new THREE.Vector3();
            cameraEl.object3D.getWorldPosition(worldPos);
            cameraPos = { x: worldPos.x, y: worldPos.y, z: worldPos.z };
          }

          const targetDisc = document.createElement('a-plane');
          targetDisc.setAttribute('class', 'target');
          targetDisc.setAttribute('shootable', '');
          targetDisc.setAttribute('width', '1.2');
          targetDisc.setAttribute('height', '1.2');

          const isSpecial = Math.random() < 0.25;
          targetDisc.dataset.special = isSpecial ? "true" : "false";
          const textureUrl = isSpecial ? this.specialTexture : this.normalTexture;

          targetDisc.setAttribute('material', `src: url(${textureUrl}); transparent: true; side: double; shader: flat`);

          const angle = Math.random() * Math.PI * 2;
          const distance = 2.0 + Math.random() * 2.0;
          
          const x = cameraPos.x + Math.cos(angle) * distance;
          const y = cameraPos.y + (Math.random() - 0.5) * 1.5;
          const z = cameraPos.z + Math.sin(angle) * distance;

          targetDisc.setAttribute('position', `${x} ${y} ${z}`);
          targetDisc.setAttribute('animation', 'property: scale; from: 0 0 0; to: 1 1 1; dur: 300');

          this.sceneEl.appendChild(targetDisc);

          setTimeout(() => {
            if (targetDisc.object3D && cameraEl && cameraEl.object3D) {
              const camPos = new THREE.Vector3();
              cameraEl.object3D.getWorldPosition(camPos);
              targetDisc.object3D.lookAt(camPos);
            }
          }, 50);

          setTimeout(() => {
            if (targetDisc.parentNode) {
              targetDisc.parentNode.removeChild(targetDisc);
            }
          }, 5000);
        },

        stop: function () {
          clearInterval(this.spawnerInterval);
          document.querySelectorAll('.target').forEach(el => el.parentNode.removeChild(el));
        }
      });

      // Selecionar modo e iniciar jogo
      function selectMode(mode) {
        gameMode = mode;
        score = 0;
        timeLeft = 30;
        gameStarted = true;

        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-over-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('score-val').innerText = score;

        if (gameMode === 'arcade') {
          document.getElementById('timer-container').style.display = 'block';
          document.getElementById('timer-val').innerText = timeLeft;

          timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-val').innerText = timeLeft;

            if (timeLeft <= 0) {
              endGame();
            }
          }, 1000);
        } else {
          // Modo Livre (sem limite de tempo)
          document.getElementById('timer-container').style.display = 'none';
        }

        const scene = document.querySelector('a-scene');
        if (scene && scene.components['target-spawner']) {
          scene.components['target-spawner'].startSpawning();
        }
      }

      function endGame() {
        gameStarted = false;
        clearInterval(timerInterval);

        const scene = document.querySelector('a-scene');
        if (scene && scene.components['target-spawner']) {
          scene.components['target-spawner'].stop();
        }

        document.getElementById('hud').style.display = 'none';
        document.getElementById('final-score').innerText = score;
        document.getElementById('game-over-screen').style.display = 'flex';
      }

      function returnToMenu() {
        gameStarted = false;
        clearInterval(timerInterval);

        const scene = document.querySelector('a-scene');
        if (scene && scene.components['target-spawner']) {
          scene.components['target-spawner'].stop();
        }

        document.getElementById('hud').style.display = 'none';
        document.getElementById('game-over-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'flex';
      }
    </script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <!-- Menu Inicial com Seleção de Modos -->
    <div id="start-screen" class="screen">
      <h1>Tiro ao Alvo AR</h1>
      <p>Alvos vermelhos = 10 pts.<br>Alvos pretos e azuis (especiais) = 20 pts!</p>
      
      <button class="btn" onclick="selectMode('arcade')">Modo Arcade (30s)</button>
      <button class="btn btn-secondary" onclick="selectMode('livre')">Modo Livre (Sem Tempo)</button>
    </div>

    <!-- Tela de Fim de Jogo -->
    <div id="game-over-screen" class="screen">
      <h1>Fim de Jogo!</h1>
      <p>Pontuação final: <span id="final-score" style="color: #E50914; font-weight: bold;">0</span> pontos.</p>
      <button class="btn" onclick="selectMode(gameMode)">Jogar Novamente</button>
      <button class="btn btn-secondary" onclick="returnToMenu()">Menu Principal</button>
    </div>

    <!-- Placar e Cronômetro (HUD) -->
    <div id="hud">
      <div>Pontos: <span id="score-val">0</span></div>
      <div id="timer-container">Tempo: <span id="timer-val">30</span>s</div>
    </div>

    <!-- Cena A-Frame com AR.js -->
    <a-scene target-spawner screen-tap-handler embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
      
      <a-entity camera look-controls id="main-camera">
        <a-entity position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                  material="color: white; shader: flat">
        </a-entity>
      </a-entity>

      <a-light type="ambient" color="#FFF"></a-light>
    </a-scene>

  </body>
</html>
