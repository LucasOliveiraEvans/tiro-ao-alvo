<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Tiro ao Alvo - Controle Total</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background-color: #000;
        touch-action: none;
      }

      /* Camada de UI / Telas */
      .ui-layer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        text-align: center;
        padding: 20px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      p {
        font-size: 15px;
        color: #ddd;
        max-width: 320px;
        line-height: 1.5;
        margin-bottom: 25px;
      }

      .btn {
        width: 100%;
        max-width: 260px;
        padding: 16px 20px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background: #E50914;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(229, 9, 20, 0.5);
        margin-bottom: 15px;
        -webkit-tap-highlight-color: transparent;
      }

      .btn-secondary {
        background: #0055FF;
        box-shadow: 0 4px 15px rgba(0, 85, 255, 0.5);
      }

      .btn-quit {
        background: #333;
        color: #fff;
        font-size: 13px;
        padding: 8px 14px;
        border-radius: 20px;
        border: 1px solid #666;
        width: auto;
        margin: 0;
        box-shadow: none;
        cursor: pointer;
      }

      /* HUD */
      #hud {
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        display: none;
        justify-content: space-between;
        align-items: center;
        color: white;
        font-size: 20px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        z-index: 500;
        pointer-events: none;
      }

      #hud * {
        pointer-events: auto;
      }

      /* Retículo de mira central */
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 16px;
        height: 16px;
        margin-top: -8px;
        margin-left: -8px;
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 50%;
        pointer-events: none;
        z-index: 400;
        display: none;
      }

      #crosshair::after {
        content: '';
        position: absolute;
        top: 6px;
        left: 6px;
        width: 4px;
        height: 4px;
        background: white;
        border-radius: 50%;
      }

      /* Instrução de arrastar na tela */
      #drag-hint {
        position: absolute;
        bottom: 30px;
        width: 100%;
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        pointer-events: none;
        z-index: 400;
        display: none;
        text-shadow: 1px 1px 2px #000;
      }
    </style>
  </head>
  <body>

    <!-- Menu Inicial -->
    <div id="start-layer" class="ui-layer">
      <h1>Tiro ao Alvo AR</h1>
      <p>
        Vermelho = 10 pts<br>
        <b>Preto & Azul (Especial) = 20 pts</b><br><br>
        Arraste o dedo na tela para olhar ao redor em 360° e toque nos alvos!
      </p>
      <button class="btn" onclick="startGame('arcade')">MODO ARCADE (30s)</button>
      <button class="btn btn-secondary" onclick="startGame('livre')">MODO LIVRE (Treino)</button>
    </div>

    <!-- Tela de Game Over -->
    <div id="game-over-layer" class="ui-layer" style="display: none;">
      <h1>Fim de Jogo!</h1>
      <p>Pontuação Final:<br><span id="final-score" style="font-size: 36px; color: #E50914; font-weight: bold;">0</span> PONTOS</p>
      <button class="btn" onclick="startGame(gameMode)">JOGAR NOVAMENTE</button>
      <button class="btn btn-secondary" onclick="returnToMenu()">MENU PRINCIPAL</button>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div>Pontos: <span id="score-val">0</span></div>
      <div id="timer-box">Tempo: <span id="timer-val">30</span>s</div>
      <button class="btn btn-quit" onclick="returnToMenu()">Menu</button>
    </div>

    <!-- Mira Central -->
    <div id="crosshair"></div>
    <div id="drag-hint">Arraste para girar a câmera</div>

    <script>
      let camera, scene, renderer;
      let targets = [];
      let score = 0;
      let timeLeft = 30;
      let gameMode = 'arcade';
      let gameStarted = false;
      let timerInterval = null;
      let spawnInterval = null;

      let normalTexture, specialTexture;

      // Variáveis para controle de toque/arrastar (Touch Look)
      let isDragging = false;
      let previousMousePosition = { x: 0, y: 0 };
      let lon = 0, lat = 0;
      let phi = 0, theta = 0;

      function createNormalTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        const rings = ['#E50914', '#FFFFFF', '#E50914', '#FFFFFF', '#E50914'];
        rings.forEach((color, i) => {
          ctx.beginPath();
          ctx.arc(128, 128, 128 - (i * 24), 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
        });
        return new THREE.CanvasTexture(canvas);
      }

      function createSpecialTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        const rings = ['#0055FF', '#000000', '#0055FF', '#000000', '#00E5FF'];
        rings.forEach((color, i) => {
          ctx.beginPath();
          ctx.arc(128, 128, 128 - (i * 24), 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
        });
        return new THREE.CanvasTexture(canvas);
      }

      function initThreeJS() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);

        normalTexture = createNormalTexture();
        specialTexture = createSpecialTexture();

        // Câmera traseira do telemóvel no fundo
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
          .then(stream => {
            const video = document.createElement('video');
            video.srcObject = stream;
            video.play();
            video.style.position = 'fixed';
            video.style.top = '0';
            video.style.left = '0';
            video.style.width = '100vw';
            video.style.height = '100vh';
            video.style.objectFit = 'cover';
            video.style.zIndex = '-1';
            document.body.appendChild(video);
          })
          .catch(err => console.warn("Câmera indisponível:", err));

        // Eventos de Contato / Arrastar para olhar ao redor
        window.addEventListener('resize', onWindowResize);
        
        document.addEventListener('pointerdown', onPointerDown, { passive: false });
        document.addEventListener('pointermove', onPointerMove, { passive: false });
        document.addEventListener('pointerup', onPointerUp, { passive: false });

        animate();
      }

      // Lógica de rotação suave ao arrastar o dedo na tela
      function onPointerDown(e) {
        if (e.target.tagName === 'BUTTON') return;
        isDragging = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      }

      function onPointerMove(e) {
        if (!isDragging || !gameStarted) return;

        const deltaX = e.clientX - previousMousePosition.x;
        const deltaY = e.clientY - previousMousePosition.y;

        lon -= deltaX * 0.3;
        lat = Math.max(-85, Math.min(85, lat + deltaY * 0.3));

        previousMousePosition = { x: e.clientX, y: e.clientY };
      }

      function onPointerUp(e) {
        if (!isDragging) return;
        isDragging = false;

        // Se o movimento foi mínimo, conta como um tiro/clique
        const moveDist = Math.abs(e.clientX - previousMousePosition.x) + Math.abs(e.clientY - previousMousePosition.y);
        if (moveDist < 5 && e.target.tagName !== 'BUTTON') {
          checkShoot(e.clientX, e.clientY);
        }
      }

      // Atualiza a direção para onde a câmara está a olhar com base no arrastar
      function updateCameraRotation() {
        phi = THREE.MathUtils.degToRad(90 - lat);
        theta = THREE.MathUtils.degToRad(lon);

        const target = new THREE.Vector3();
        target.x = 500 * Math.sin(phi) * Math.cos(theta);
        target.y = 500 * Math.cos(phi);
        target.z = 500 * Math.sin(phi) * Math.sin(theta);

        camera.lookAt(target);
      }

      function spawnTarget() {
        if (!gameStarted) return;
        if (targets.length >= 6) return;

        const isSpecial = Math.random() < 0.35;
        const mat = new THREE.MeshBasicMaterial({
          map: isSpecial ? specialTexture : normalTexture,
          transparent: true,
          side: THREE.DoubleSide
        });

        // Tamanho perfeitamente visível (1.2m)
        const size = 1.2;
        const geo = new THREE.PlaneGeometry(size, size);
        const mesh = new THREE.Mesh(geo, mat);

        mesh.userData = { isSpecial: isSpecial, hit: false };

        // Geração esférica em 360° ao redor da câmara (frente, costas, lados, altura dos olhos)
        const u = Math.random();
        const v = Math.random();
        const spawnLon = u * 360;
        const spawnLat = (v - 0.5) * 40; // Variação vertical controlada em torno do horizonte

        const pPhi = THREE.MathUtils.degToRad(90 - spawnLat);
        const pTheta = THREE.MathUtils.degToRad(spawnLon);
        const distance = 6.0 + Math.random() * 3.0;

        mesh.position.set(
          distance * Math.sin(pPhi) * Math.cos(pTheta),
          distance * Math.cos(pPhi),
          distance * Math.sin(pPhi) * Math.sin(pTheta)
        );

        mesh.lookAt(camera.position);

        scene.add(mesh);
        targets.push(mesh);

        setTimeout(() => { removeTarget(mesh); }, 7000);
      }

      function removeTarget(mesh) {
        const idx = targets.indexOf(mesh);
        if (idx !== -1) {
          targets.splice(idx, 1);
          scene.remove(mesh);
          if (mesh.geometry) mesh.geometry.dispose();
          if (mesh.material) mesh.material.dispose();
        }
      }

      function checkShoot(clientX, clientY) {
        if (!gameStarted) return;

        const mouse = new THREE.Vector2();
        mouse.x = (clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(clientY / window.innerHeight) * 2 + 1;

        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObjects(targets);

        if (intersects.length > 0) {
          const hitMesh = intersects[0].object;
          if (hitMesh && !hitMesh.userData.hit) {
            hitMesh.userData.hit = true;
            const pts = hitMesh.userData.isSpecial ? 20 : 10;
            score += pts;
            document.getElementById('score-val').innerText = score;
            removeTarget(hitMesh);
          }
        }
      }

      function startGame(mode) {
        gameMode = mode;
        score = 0;
        timeLeft = 30;
        gameStarted = true;
        lon = 0;
        lat = 0;

        document.getElementById('start-layer').style.display = 'none';
        document.getElementById('game-over-layer').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('crosshair').style.display = 'block';
        document.getElementById('drag-hint').style.display = 'block';
        document.getElementById('score-val').innerText = score;

        // Esconde a dica de arrastar após 4 segundos
        setTimeout(() => {
          const hint = document.getElementById('drag-hint');
          if (hint) hint.style.display = 'none';
        }, 4000);

        [...targets].forEach(removeTarget);

        if (gameMode === 'arcade') {
          document.getElementById('timer-box').style.display = 'block';
          document.getElementById('timer-val').innerText = timeLeft;
          if (timerInterval) clearInterval(timerInterval);
          timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-val').innerText = timeLeft;
            if (timeLeft <= 0) endGame();
          }, 1000);
        } else {
          document.getElementById('timer-box').style.display = 'none';
        }

        if (spawnInterval) clearInterval(spawnInterval);
        spawnTarget();
        spawnInterval = setInterval(spawnTarget, 2000);
      }

      function endGame() {
        gameStarted = false;
        clearInterval(timerInterval);
        clearInterval(spawnInterval);
        [...targets].forEach(removeTarget);

        document.getElementById('hud').style.display = 'none';
        document.getElementById('crosshair').style.display = 'none';
        document.getElementById('drag-hint').style.display = 'none';
        document.getElementById('final-score').innerText = score;
        document.getElementById('game-over-layer').style.display = 'flex';
      }

      function returnToMenu() {
        gameStarted = false;
        clearInterval(timerInterval);
        clearInterval(spawnInterval);
        [...targets].forEach(removeTarget);

        document.getElementById('hud').style.display = 'none';
        document.getElementById('crosshair').style.display = 'none';
        document.getElementById('drag-hint').style.display = 'none';
        document.getElementById('game-over-layer').style.display = 'none';
        document.getElementById('start-layer').style.display = 'flex';
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        updateCameraRotation();
        renderer.render(scene, camera);
      }

      window.onload = initThreeJS;
    </script>
  </body>
</html>
